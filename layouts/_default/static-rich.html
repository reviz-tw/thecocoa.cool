{{ define "main" }}
<article class="static-rich">
  <div class="static-rich-hero">
    <p class="static-rich-kicker">THE COCOA</p>
    <h1 class="static-rich-title">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="static-rich-subtitle">{{ . }}</p>
    {{ end }}
  </div>
  <div class="static-rich-panel">
    <div class="static-rich-content">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
