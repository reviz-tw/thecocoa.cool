{{ define "main" }}

<div class="section-head">
  <p class="section-kicker">THE COCOA</p>
  <h1 class="section-title">所有分類</h1>
  <p class="section-desc">依主題瀏覽，找到你感興趣的報導。</p>
</div>

<div class="terms-grid">
  {{ range .Data.Terms.Alphabetical }}
  <a href="{{ .Page.RelPermalink }}" class="term-card">
    <div class="term-card-inner">
      <h2 class="term-name">{{ .Page.Title }}</h2>
      <p class="term-count">{{ len .Pages }} 篇報導</p>
      {{ with .Pages.ByDate.Reverse }}
      {{ with index . 0 }}
      <p class="term-latest">最新：{{ .Title | truncate 30 }}</p>
      {{ end }}
      {{ end }}
    </div>
    <div class="term-card-arrow">→</div>
  </a>
  {{ end }}
</div>

{{ end }}
