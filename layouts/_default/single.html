{{ define "main" }}
<article style="max-width: 800px; margin: 0 auto;">
  <header style="margin-bottom: 2rem;">
    {{ if .Params.category }}
    <div style="margin-bottom: 1rem;">
      <span class="card-tag accent">{{ .Params.category }}</span> 
      <span class="card-date" style="margin-left: 1rem;">{{ .Date.Format "2006年1月2日" }}</span>
    </div>
    {{ end }}
    <h1 style="font-size: 2.5rem; line-height: 1.3; margin-bottom: 1.5rem;">{{ .Title }}</h1>
    {{ if .Params.image }}
    <img src="{{ .Params.image }}" alt="{{ .Title }}" style="width: 100%; height: auto; border-radius: 8px;">
    {{ end }}
  </header>
  <div class="content" style="font-size: 1.125rem; color: var(--text-muted);">
    {{ .Content }}
  </div>
</article>
{{ end }}
